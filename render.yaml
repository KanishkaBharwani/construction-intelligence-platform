services:
  - type: web
    name: buildintel-ai-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
